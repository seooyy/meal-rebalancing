# 확인 항목 안내 — C 담당
#
# A의 rules.yaml은 확인할 항목의 '이름'만 준다 ("영업일·품절·주문 불편·고객 의견").
# 점주가 그 이름만 보고 무엇을 꺼내 봐야 하는지, 봤으면 뭐가 갈리는지는 알 수 없다.
# 화면 1의 후보 카드가 이 표를 붙여 항목마다 한 줄을 덧댄다.
#
# 한 줄 안에 셋을 넣는다. 셋으로 쪼개 쓰면 카드가 길어져 읽히지 않는다.
#   1) 무엇을 꺼내 무엇과 비교하나
#   2) 그렇게 나왔다면 무슨 뜻인가
#   3) 그래서 어느 후보로 가거나, 여기서 끝나는가
#
# 키는 rules.yaml의 확인 문자열을 '·'와 ', 그리고 '로 끊은 조각과 정확히 같아야 한다.
# 어긋나면 tests/test_check_guide.py가 먼저 깨진다. 화면에서는 안내 없이 이름만 나간다.
#
# stop: true 는 "이것이 원인이면 메뉴를 바꿀 일이 아니다"라는 뜻이다.
# 손익 시뮬레이터를 돌리기 전에 걸러내야 하는 항목이라 화면이 따로 표시한다.
#
# 소유: C. A의 config/rules.yaml은 읽기만 한다.

version: 1

items:
  영업일:
    stop: true
    안내: "1~3월과 4~6월의 실제 영업일 수를 비교해 주세요. 휴무, 임시휴업, 단축영업 때문에 영업일이 줄었다면 메뉴나 가격보다 영업 일정을 먼저 조정해야 합니다."

  품절:
    stop: true
    안내: "마감 전에 품절된 메뉴와 재료 부족으로 받지 못한 주문을 확인해 주세요. 품절이 반복됐다면 판매전략보다 발주량과 준비량을 먼저 조정해야 합니다."

  주문 불편:
    안내: "대기 시간, 주문 취소와 이탈, 키오스크나 배달앱 오류, 포장 대기 혼잡을 확인해 주세요. 주문 과정에서 고객이 이탈한다면 주문 절차 개선을 검토합니다."

  고객 의견:
    안내: "최근 3개월의 리뷰, 전화 문의, 현장 의견에서 반복되는 불편을 확인해 주세요. 반복되는 의견이 있다면 해당 문제와 관련된 실행안을 우선 검토합니다."

  메뉴 판매 비중:
    안내: "1~3월과 4~6월의 메뉴별 판매 수량을 비교해 주세요. 가격이 높은 메뉴의 판매 비중이 줄었다면 메뉴 구성 변화가 건당 결제금액에 영향을 줬을 수 있습니다."

  옵션 선택률:
    안내: "사이드, 음료, 추가 옵션이 포함된 주문의 비율을 두 기간으로 나눠 비교해 주세요. 선택률이 줄었다면 옵션이 더 잘 보이도록 구성하는 방안을 검토합니다."

  가격 변경 이력:
    안내: "최근 6개월 동안 메뉴 가격을 바꾼 시점과 건당 결제금액이 변한 시점을 비교해 주세요. 두 시점이 겹친다면 추가 할인보다 현재 가격의 손익을 먼저 확인합니다."

  실제 이용 언어와 주문의 어려움:
    안내: "외국인 고객이 실제로 사용하는 언어와 주문 중 어려움을 겪는 지점을 확인해 주세요. 관찰한 내용을 바탕으로 사진이나 다국어 메뉴 안내가 필요한지 판단합니다."

  예약:
    안내: "예약 문의 건수와 매장에서 받지 못해 거절한 건수를 확인해 주세요. 거절한 예약이 있다면 예약 조건과 수용 방식을 조정할 수 있습니다."

  단체 주문:
    안내: "4인 이상 주문의 건수, 결제금액, 준비 시간을 확인해 주세요. 받지 못한 단체 주문이 있다면 주방이 감당할 수 있는 구성과 준비 방식을 검토합니다."

  증빙 요청:
    안내: "현금영수증, 세금계산서, 법인카드 증빙 요청의 빈도와 처리 시간을 확인해 주세요. 처리가 번거롭다면 주문과 증빙 절차를 알기 쉽게 안내하는 방안을 검토합니다."
