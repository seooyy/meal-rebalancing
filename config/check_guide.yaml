# 확인 항목 안내 — C 담당
#
# A의 rules.yaml은 확인할 항목의 '이름'만 준다 ("영업일·품절·주문 불편·고객 의견").
# 점주가 그 이름만 보고 무엇을 꺼내 봐야 하는지, 봤으면 뭐가 갈리는지는 알 수 없다.
# 화면 1의 후보 카드가 이 표를 붙여 항목마다 한 줄을 덧댄다.
#
# 한 줄 안에 셋을 넣는다. 셋으로 쪼개 쓰면 카드가 길어져 읽히지 않는다.
#   1) 무엇을 꺼내 무엇과 비교하나
#   2) 그렇게 나왔다면 무슨 뜻인가
#   3) 그래서 어느 후보로 가거나, 여기서 끝나는가
#
# 키는 rules.yaml의 확인 문자열을 '·'와 ', 그리고 '로 끊은 조각과 정확히 같아야 한다.
# 어긋나면 tests/test_check_guide.py가 먼저 깨진다. 화면에서는 안내 없이 이름만 나간다.
#
# stop: true 는 "이것이 원인이면 메뉴를 바꿀 일이 아니다"라는 뜻이다.
# 손익 시뮬레이터를 돌리기 전에 걸러내야 하는 항목이라 화면이 따로 표시한다.
#
# 소유: C. A의 config/rules.yaml은 읽기만 한다.

version: 1

items:
  영업일:
    stop: true
    안내: "1~3월과 4~6월의 실제 영업일 수를 휴무·임시휴업·단축영업까지 세어 비교한다. 영업일이 줄었다면 건수 감소는 손님이 줄어서가 아니라 문 연 날이 적어서이므로, 메뉴나 가격을 바꿀 일이 아니라 여기서 끝난다."

  품절:
    stop: true
    안내: "마감 전에 품절된 메뉴와 그 날짜, 재료가 없어 받지 못한 주문을 센다. 팔 것이 없어 못 판 것이라면 수요 문제가 아니라 발주·준비량 문제이므로, 대안을 고르는 대신 발주량을 고친다."

  주문 불편:
    안내: "대기 시간, 주문 취소·이탈, 키오스크·배달앱 오류, 포장 대기 혼잡을 본다. 주문 과정에서 손님이 빠져나가고 있다면 후보 중 '주문 과정 개선'으로 간다."

  고객 의견:
    안내: "최근 3개월 리뷰·전화·현장 불만에서 반복되는 말을 모은다. 숫자가 말하지 않는 이유가 여기 있으므로 위 항목 중 어디에 해당하는지 분류하고, 어디에도 없는 원인이면 후보를 다시 본다."

  메뉴 판매 비중:
    안내: "메뉴별 판매 수량을 1~3월과 4~6월로 나눠 비교해 비싼 메뉴 비중이 줄었는지 본다. 싼 메뉴 쪽으로 옮겨갔다면 건당 금액 하락은 구성 이동이며, 여기서 센 메뉴별 판매량이 그대로 화면 2의 입력값이 된다."

  옵션 선택률:
    안내: "사이드·음료·추가 옵션이 전체 주문의 몇 %에 붙었는지 두 기간으로 나눠 본다. 줄었다면 메인은 그대로인데 붙는 것이 빠진 것이므로 후보 중 '사이드 메뉴 노출'·'상위 옵션 노출'로 간다."

  가격 변경 이력:
    안내: "최근 6개월 안에 메뉴 가격을 올리거나 내린 적이 있는지와 그 시점을 확인한다. 가격을 내린 시점과 건당 금액이 떨어진 시점이 겹치면 원인은 이미 아는 것이므로, 할인이나 혜택을 더 얹지 말고 화면 2에 변경 후 가격을 넣는다."

  실제 이용 언어와 주문의 어려움:
    안내: "외국인 손님이 실제로 쓰는 언어와 주문에서 막히는 지점을 관찰한다. 국적을 추정하지 말고 관찰한 언어를 기준으로 후보 중 '사진 메뉴판'과 '다국어 메뉴 설명' 가운데 고른다."

  예약:
    안내: "예약 문의 건수와 그중 받지 못해 거절한 건수를 센다. 거절한 예약이 있다면 수요가 아니라 수용 방식의 문제이므로 후보 중 '예약 구성'으로 간다."

  단체 주문:
    안내: "4인 이상 주문의 건수·금액과 준비에 걸린 시간을 본다. 단체 주문이 늘었는데 주방이 받지 못했다면 놓친 매출이며, 늘어난 준비 시간은 화면 2의 추가 조리시간에 넣는다."

  증빙 요청:
    안내: "현금영수증·세금계산서·법인카드 증빙 요청 빈도와 처리에 걸리는 시간을 본다. 증빙이 번거로우면 법인 손님이 다른 곳으로 가므로 후보 중 '주문·증빙 안내'로 간다."
