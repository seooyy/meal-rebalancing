# 대안 추천 정책 — C 담당
#
# 기획서 6절의 2단계 추천이 쓰는 표다.
#   1단계: A의 rules.yaml이 만든 실행 후보 문자열을 B의 options.yaml 대안 구분에 잇는다.
#   2단계: 남은 대안을 같은 조건으로 계산해 필요 증가율 오름차순으로 세운다.
#
# 이 표를 코드에 박지 않는 이유는 A의 후보 문구가 아직 바뀔 수 있기 때문이다.
# 여기 없는 후보 문자열이 들어오면 조용히 버리지 않고 화면에 "연결되지 않은 후보"로
# 표시한다. 조용히 버리면 추천 대상이 줄어든 것을 아무도 모른다.
#
# 소유: C. A의 config/rules.yaml, B의 config/options.yaml은 읽기만 한다.

version: 1

# ---------------------------------------------------------------------------
# 1단계 — 진단 후보 -> 대안 구분
#
# 오른쪽 값은 options.yaml의 types와 정확히 같아야 한다. 어긋나면 load_policy가 막는다.
#
# 객단가 문제에 '조건부 혜택'이 없는 것이 이 표의 핵심이다.
# 기획서 3절: "여기서 할인하면 객단가 하락을 가속한다."
# 계산만으로 순위를 매기면 할인안이 상위에 올 수 있어 1단계가 먼저 걸러야 한다.
# ---------------------------------------------------------------------------
candidate_kinds:
  # 동반 부진 (rules.yaml: 동반_부진)
  선택형 세트 구성: 구성 재설계
  사이드 메뉴 노출: 판매 노출 개선
  주문 과정 개선: 주문·운영 편의 개선

  # 객단가 문제 (rules.yaml: 객단가_문제)
  메뉴 구성 조정: 구성 재설계
  상위 옵션 노출: 판매 노출 개선
  기본형＋선택 옵션: 구성 재설계

  # 방문 문제 (rules.yaml: 방문_문제)
  조건부 혜택: 혜택 재설계

  # 집단 후보 (rules.yaml: 외국인_증가 / 법인_증가)
  사진 메뉴판: 주문·운영 편의 개선
  다국어 메뉴 설명: 주문·운영 편의 개선
  예약 구성: 주문·운영 편의 개선
  주문·증빙 안내: 주문·운영 편의 개선

# 후보를 점주가 바로 이해할 수 있는 실행안으로 풀어 쓴다.
# assumptions는 현재 입력값이 없을 때만 쓰는 기본 가정이며, 실제 도입 전 확인 대상이다.
candidate_actions:
  선택형 세트 구성:
    base_option: redesign
    title: 대표 메뉴에 선택형 세트 1개 만들기
    action: 대표 메뉴에 사이드 또는 음료를 1개 고를 수 있는 세트를 만든다.
    measure: 세트 선택률과 세트당 추가 조리시간을 기록한다.
    precheck: 사이드 재고와 세트 준비 시간을 먼저 확인한다.
    assumptions: {price_delta: 2000, food_cost_delta: 800, application_rate: 0.2, setup_cost: 50000, extra_minutes: 0.2}
  사이드 메뉴 노출:
    base_option: visibility
    title: 대표 메뉴 옆에 사이드·음료를 다시 배치하기
    action: 메뉴판·주문 화면에서 대표 메뉴 바로 옆에 사이드와 음료를 노출한다.
    measure: 사이드·음료가 붙는 주문 비율을 전후로 비교한다.
    precheck: 사진·메뉴판 수정 비용과 품절 가능성을 확인한다.
    assumptions: {setup_cost: 50000}
  주문 과정 개선:
    base_option: ordering
    title: 주문 단계를 줄이고 포장 동선을 정리하기
    action: 주문 화면의 선택 단계를 줄이고 포장 대기 위치를 한 곳으로 정리한다.
    measure: 주문 취소·이탈과 포장 대기 시간을 기록한다.
    precheck: 바쁜 시간대의 대기 시간과 주문 오류를 먼저 확인한다.
    assumptions: {setup_cost: 100000, extra_minutes: 0.2}
  메뉴 구성 조정:
    base_option: redesign
    title: 기본 구성·양·사이드 조합 다시 정하기
    action: 가격을 내리기보다 기본 반찬·양·사이드 구성을 바꾼 메뉴 1개를 시험한다.
    measure: 해당 메뉴 판매량과 건당 공헌이익을 전후로 비교한다.
    precheck: 최근 가격 변경 시점과 메뉴별 판매 비중 변화를 확인한다.
    assumptions: {food_cost_delta: -300, setup_cost: 50000, extra_minutes: 0.1}
  상위 옵션 노출:
    base_option: visibility
    title: 추가 토핑·곱빼기 같은 상위 옵션 보이게 하기
    action: 대표 메뉴에 추가 토핑·곱빼기·음료 옵션을 주문 화면 첫 위치에 둔다.
    measure: 옵션 선택률과 옵션 1건당 남는 금액을 기록한다.
    precheck: 옵션 준비 시간이 주문 지연을 만들지 않는지 확인한다.
    assumptions: {price_delta: 2000, food_cost_delta: 600, application_rate: 0.2, setup_cost: 30000, extra_minutes: 0.1}
  기본형＋선택 옵션:
    base_option: redesign
    title: 기본 메뉴와 추가 선택을 분리하기
    action: 기본형 가격은 유지하고 반찬·토핑·음료를 선택 옵션으로 분리한다.
    measure: 기본형 대비 옵션 추가율과 객단가를 기록한다.
    precheck: 옵션 조합이 너무 많아 주문이 복잡해지지 않는지 확인한다.
    assumptions: {price_delta: 1000, food_cost_delta: 300, application_rate: 0.3, setup_cost: 30000, extra_minutes: 0.1}
  조건부 혜택:
    base_option: discount
    title: 한가한 시간대에만 조건부 혜택 시험하기
    action: 전면 할인 대신 평일·첫 방문·특정 시간대에만 혜택을 적용한다.
    measure: 혜택 사용 건수와 혜택 없는 주문의 변화를 함께 기록한다.
    precheck: 혜택이 기존 손님의 할인 전환만 만드는지 확인한다.
    assumptions: {price_delta: -1000, application_rate: 0.2, setup_cost: 30000}
  사진 메뉴판:
    base_option: ordering
    title: 사진이 있는 메뉴판 만들기
    action: 실제 주문이 많은 메뉴부터 사진과 가격을 함께 표시한다.
    measure: 사진 메뉴의 주문 비율과 주문 문의 수를 기록한다.
    precheck: 실제 이용 언어와 손님이 막히는 메뉴 이름을 관찰한다.
    assumptions: {setup_cost: 100000}
  다국어 메뉴 설명:
    base_option: ordering
    title: 실제 이용 언어로 메뉴 설명 추가하기
    action: 관찰한 이용 언어로 메뉴명·재료·매운 정도·주문 방법을 설명한다.
    measure: 주문 문의·취소와 해당 언어 메뉴 주문을 기록한다.
    precheck: 국적을 추정하지 말고 실제 이용 언어를 확인한다.
    assumptions: {setup_cost: 80000}
  예약 구성:
    base_option: ordering
    title: 4인 이상 예약·단체 주문 방식 정하기
    action: 단체 주문의 최소 인원·주문 마감 시간·메뉴 구성을 한 장으로 안내한다.
    measure: 예약 문의·수락·거절 건수와 준비 시간을 기록한다.
    precheck: 거절한 예약이 실제로 있었는지와 주방 수용 시간을 확인한다.
    assumptions: {setup_cost: 50000, extra_minutes: 0.2}
  주문·증빙 안내:
    base_option: ordering
    title: 법인 주문·증빙 절차를 한 장으로 안내하기
    action: 법인카드·현금영수증·세금계산서 요청 방법과 담당 연락처를 안내한다.
    measure: 증빙 문의 처리 시간과 법인 주문의 이탈 여부를 기록한다.
    precheck: 자주 들어오는 증빙 요청과 처리 지연 지점을 확인한다.
    assumptions: {setup_cost: 30000}

# ---------------------------------------------------------------------------
# 2단계 — 순위 기준
#
# metric은 필요 증가율(%)이다. 기존 판매량 대비 몇 % 더 팔아야 기존 공헌이익을
# 유지하는가이며, 낮을수록 달성 조건이 가볍다. **성공 확률이 아니다.**
#
# 절대 금액이 아니라 증가율을 쓰는 이유는 메뉴별 판매 규모가 달라 금액으로는
# 비교가 되지 않기 때문이다. 판매량을 모르면 지수 100 기준의 같은 값이 나온다.
#
# 동점은 도입비용, 추가 조리시간 순으로 가른다. 둘 다 점주가 먼저 부담하는 값이다.
# ---------------------------------------------------------------------------
ranking:
  metric: increase_pct
  level: base
  tie_breakers:
    - setup_cost
    - extra_minutes

# ---------------------------------------------------------------------------
# 표시 문구 — 화면에 고정으로 남는다
# ---------------------------------------------------------------------------
display:
  notice: 현재 이익을 유지하기 위해 얼마나 더 팔아야 하는지를 비교한 결과이며 실제 판매 성과를 예측하지 않습니다
  unstable: 재료비에 따라 우선순위가 달라집니다. 실제 원가를 먼저 확인해 주세요
  no_candidate: 이 지역에서 우선 검토할 만한 변화가 발견되지 않았습니다
  no_diagnosis: 지역 자료가 부족해 우선순위를 정하기 어렵습니다
