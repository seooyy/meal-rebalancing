# 변화 유형 -> 실행 후보 매핑과 게이트 임계값
#
# 담당 A. C가 화면 1에서 읽는다 (docs/contract.md 3절).
# 근거 문서: docs/plan/02_지역_소비집단_진단.md "실행 후보 매핑 (규칙 테이블)"
# 원문 대응: docs/project_idea.md 5절 표
#
# 값을 코드에 박지 않고 여기 두는 이유는 임계값 근거가 아직 잠정이기 때문이다.
# 밴드를 바꾸면 tests/test_diagnose.py의 4셀 회귀 테스트가 먼저 깨진다.
# **특정 셀의 판정을 맞추려고 밴드를 조정하지 않는다.**

version: 1

# ---------------------------------------------------------------------------
# 게이트 — 규칙에 걸려도 여기를 통과해야 후보로 노출된다
# ---------------------------------------------------------------------------
gates:
  # 0. 우선순위 게이트 (docs/plan/02 "실행 후보 생성 조건")
  #    셀 우선순위가 이 값 미만이면 집단별 규칙을 보지 않고 후보를 비운다.
  #    '낮음'까지 포함하면 후보 지역이 한식 23->74곳, 서양음식 21->56곳으로
  #    늘어 "억지로 후보를 만드는 도구"가 된다.
  min_priority: 중간

  # 1. 규모 게이트
  #    집단의 B기간 금액 비중이 이 값 미만이면 후보에서 제외한다.
  #    4셀 법인은 전부 여기 해당한다 (2.43% ~ 4.75%).
  min_share_pct: 5.0

  # 2. 전국 초과분 게이트
  #    지역 변화가 동일 업종 전국 기준선과 같은 방향·비슷한 크기면
  #    "전국 공통 흐름"으로 표기하고 지역 고유 후보로 제시하지 않는다.
  #    법인이 특히 위험하다: 4셀 모두 +7~22% 증가했지만 전국 기준선이
  #    한식 +46.41% / 서양음식 +34.75%라 지역 법인은 전국보다 느리다.
  national_excess_band_pct: 1.0

  # 3. 관측량 게이트 (docs/plan/01 "관측량 기준선", 잠정)
  #    min(A기간 건수, B기간 건수)가 이 값 미만이면 수치를 숨기고
  #    "관측량 부족"으로 표시한다. 후보도 만들지 않는다.
  #    근거: 우연에 의한 변화율 흔들림 sqrt(2/n)이 CNT_BAND ±5%p보다
  #    작아지는 지점이 n > 800. 실측으로 500~1,000건 구간에 극단값 집중.
  min_count: 1000

# ---------------------------------------------------------------------------
# 셀 규칙 — 지역x업종 판정(src.classify)의 '원인'에 대응한다
#
# 위에서부터 먼저 맞는 하나를 쓴다.
# '원인'은 절대 변화율이 아니라 **전국 대비 초과분**으로 가려진 값이다
# (전국 서양음식 건당금액이 -6.39% 빠진 상황에서 어떤 지역의 -4.13%는
#  하락이 아니라 +2.26%p 선방이다).
# ---------------------------------------------------------------------------
cell_rules:
  - id: 동반_부진
    원인: 동반
    확인: 영업일·품절·주문 불편·고객 의견, 그리고 메뉴 판매 비중·옵션 선택률
    후보:
      - 선택형 세트 구성
      - 사이드 메뉴 노출
      - 주문 과정 개선
    비고: 여러 요인이 함께 나타났습니다. 결제금액 비중이 큰 항목부터 확인해 주세요.

  - id: 객단가_문제
    원인: 객단가
    확인: 메뉴 판매 비중·옵션 선택률·가격 변경 이력
    후보:
      - 메뉴 구성 조정
      - 상위 옵션 노출
      - 기본형＋선택 옵션
    비고: 추가 할인은 건당 결제금액을 더 낮출 수 있으므로 우선 검토 대상에서 제외합니다.

  - id: 방문_문제
    원인: 방문
    확인: 영업일·품절·주문 불편·고객 의견
    후보:
      - 주문 과정 개선
      - 조건부 혜택
    비고: 메뉴 구성보다 고객이 주문할 기회를 놓치고 있는지 먼저 확인해 주세요.

  - id: 전국_수준
    원인: 전국 수준
    확인: null
    후보: []
    비고: 전국 흐름과 비슷하게 움직였다. 지역 고유 후보를 만들지 않는다.

# ---------------------------------------------------------------------------
# 집단 규칙 — 셀이 우선순위 게이트를 통과한 뒤에만 본다
#
# 조건: 집단 금액 변화 > amt_min_pct  AND  전국 동일 집단 대비 초과분 > 게이트
# 두 조건을 모두 걸어야 하는 이유는 전국이 더 빠르게 늘고 있을 때
# 지역의 증가를 "지역 고유 기회"로 오인하지 않기 위해서다.
# ---------------------------------------------------------------------------
group_rules:
  - id: 외국인_증가
    group: 외국인
    amt_min_pct: 1.0
    확인: 실제 이용 언어와 주문의 어려움
    후보:
      - 사진 메뉴판
      - 다국어 메뉴 설명

  - id: 법인_증가
    group: 법인
    amt_min_pct: 1.0
    확인: 예약·단체 주문·증빙 요청
    후보:
      - 예약 구성
      - 주문·증빙 안내

# ---------------------------------------------------------------------------
# 표시 규칙
# ---------------------------------------------------------------------------
display:
  # 모든 카드에 고정 표시
  footer: 지역 소비 지표는 BC카드 결제 데이터를 집계한 결과입니다.
  # A/B 비교 결과에 붙이는 주석
  seasonality: 5월 결제금액이 전국 평균 대비 약 +11%로 높음 — 계절 요인 포함
  insufficient: 관측량 부족

  # 우선순위 '낮음'에서 후보 대신 내보내는 한 줄
  # {지표}와 {값}은 diagnose가 채운다.
  reference_line: "참고: {지표}가 전국보다 {값}%p 뒤처집니다. 지금 조치가 필요한 수준은 아닙니다."

# ---------------------------------------------------------------------------
# 금지어 — 산출 텍스트에 등장하면 안 되는 해석 문구
#
# 연령·집단 차이에 선호를 얹는 순간 관측 집계가 아니라 추측이 된다.
# 우리 데이터에는 '왜'가 없다. tests/test_diagnose.py가 산출 텍스트를 훑는다.
# ---------------------------------------------------------------------------
banned_phrases:
  - 가성비
  - 선호
  - 취향
  - 1인당
  - 인당 소비
  - 소비 성향
  - 트렌드
